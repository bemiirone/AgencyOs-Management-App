<mat-card>
  <mat-card-header>
    <div class="header-content">
      <mat-card-title>FAQ Management</mat-card-title>
      <mat-card-subtitle>Manage FAQ groups and Q&A items ({{ dataSource.data.length }} total)</mat-card-subtitle>
    </div>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      New FAQ Group
    </button>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="isLoading" class="loading-state">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!isLoading && dataSource.data.length === 0" class="empty-state">
      <mat-icon>help_outline</mat-icon>
      <p>No FAQ groups found</p>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        Create your first FAQ group
      </button>
    </div>

    <table *ngIf="!isLoading" mat-table [dataSource]="dataSource" class="mat-elevation-z0">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let faq">{{ faq.title }}</td>
      </ng-container>

      <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef>Q&A Items</th>
        <td mat-cell *matCellDef="let faq">
          <span class="badge">{{ faq.items.length }} item{{ faq.items.length !== 1 ? 's' : '' }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="order">
        <th mat-header-cell *matHeaderCellDef>Order</th>
        <td mat-cell *matCellDef="let faq">{{ faq.order }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let faq">
          <button mat-icon-button matTooltip="Edit" (click)="openEditDialog(faq)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete" (click)="deleteFaq(faq)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
