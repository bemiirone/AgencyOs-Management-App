name: Deploy to Vercel & AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  REPOSITORY_NAME: agencyos-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx nx run-many --target=lint
        continue-on-error: true

      - name: Build
        run: npx nx run-many --target=build --configuration=production

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build Docker image
        run: |
          docker build \
            -t "$REGISTRY/$REPOSITORY_NAME:${{ github.sha }}" \
            -t "$REGISTRY/$REPOSITORY_NAME:latest" \
            .

      - name: Push to Amazon ECR
        run: |
          docker push "$REGISTRY/$REPOSITORY_NAME:${{ github.sha }}"
          docker push "$REGISTRY/$REPOSITORY_NAME:latest"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Pass the raw secrets to the runner's environment
          MONGODB_URI_RAW: ${{ secrets.MONGODB_URI }}
          JWT_SECRET_RAW: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET_RAW: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          # 1. Safely encode complex secrets to base64 to prevent shell metacharacters from breaking the SSH command
          MONGODB_URI_B64=$(echo -n "$MONGODB_URI_RAW" | base64 -w 0)
          JWT_SECRET_B64=$(echo -n "$JWT_SECRET_RAW" | base64 -w 0)
          ADMIN_JWT_SECRET_B64=$(echo -n "$ADMIN_JWT_SECRET_RAW" | base64 -w 0)

          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 2. Pass variables safely. Simple vars are wrapped in single quotes. 
          # Complex vars are decoded on the remote side, completely bypassing shell interpretation.
          ssh -i ~/.ssh/deploy-key "$EC2_USER@$EC2_HOST" \
            "export AWS_ACCOUNT_ID='$AWS_ACCOUNT_ID'; \
             export AWS_REGION='$AWS_REGION'; \
             export IMAGE_TAG='$IMAGE_TAG'; \
             export AWS_ACCESS_KEY_ID='$AWS_ACCESS_KEY_ID'; \
             export AWS_SECRET_ACCESS_KEY='$AWS_SECRET_ACCESS_KEY'; \
             export MONGODB_URI=\$(echo '$MONGODB_URI_B64' | base64 -d); \
             export JWT_SECRET=\$(echo '$JWT_SECRET_B64' | base64 -d); \
             export ADMIN_JWT_SECRET=\$(echo '$ADMIN_JWT_SECRET_B64' | base64 -d); \
             bash -s" << 'EOFSH'
            set -e
            REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            REPOSITORY_NAME="agencyos-backend"

            # This will now succeed because AWS_REGION is correctly populated
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$REGISTRY"
            
            docker pull "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
            docker rm -f agencyos-backend || true
            
            docker run -d \
              --name agencyos-backend \
              -p 3000:3000 \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e MONGODB_URI="$MONGODB_URI" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
              "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
          EOFSH

          rm -f ~/.ssh/deploy-key
