name: Deploy to Vercel & AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  REPOSITORY_NAME: agencyos-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx nx run-many --target=lint
        continue-on-error: true

      - name: Build
        run: npx nx run-many --target=build --configuration=production

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build Docker image
        run: |
          docker build \
            -t "$REGISTRY/$REPOSITORY_NAME:${{ github.sha }}" \
            -t "$REGISTRY/$REPOSITORY_NAME:latest" \
            .

      - name: Push to Amazon ECR
        run: |
          docker push "$REGISTRY/$REPOSITORY_NAME:${{ github.sha }}"
          docker push "$REGISTRY/$REPOSITORY_NAME:latest"

            - name: Deploy to EC2
        env:
          # These are available to the GitHub Runner
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}     # <-- Added
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # <-- Added
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The 'env' command here passes the GitHub secrets into the remote EC2 shell
          ssh -i ~/.ssh/deploy-key "$EC2_USER@$EC2_HOST" \
            env AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" \
                AWS_REGION="$AWS_REGION" \
                IMAGE_TAG="$IMAGE_TAG" \
                AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
                AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
                MONGODB_URI="$MONGODB_URI" \
                JWT_SECRET="$JWT_SECRET" \
                ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            bash -s << 'EOFSH'
            set -e
            REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            REPOSITORY_NAME="agencyos-backend"

            # NOW THIS WILL WORK, because the EC2 shell has the AWS credentials
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$REGISTRY"
            
            docker pull "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
            docker rm -f agencyos-backend || true
            
            docker run -d \
              --name agencyos-backend \
              -p 3000:3000 \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e MONGODB_URI="$MONGODB_URI" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
              "$REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
          EOFSH

          rm -f ~/.ssh/deploy-key
