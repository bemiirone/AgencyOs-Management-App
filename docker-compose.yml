services:
  mongo-express:
    image: mongo-express:latest
    container_name: agencyos-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "false"
      ME_CONFIG_MONGODB_URL: ${MONGODB_URI}
      ME_CONFIG_BASICAUTH: "false"
    restart: unless-stopped
    profiles:
      - tools
