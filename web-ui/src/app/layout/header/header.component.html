<div class="navbar bg-base-100 shadow-sm px-4 lg:px-6">
  <div class="flex-none lg:hidden">
    <button class="btn btn-square btn-ghost" (click)="onToggleDrawer()">
      <fa-icon [icon]="faBars" size="lg"></fa-icon>
    </button>
  </div>

  <div class="flex-1">
    <h1 class="text-xl font-semibold text-base-content/80">AgencyOS</h1>
  </div>

  <div class="flex-none gap-2">
    <button class="btn btn-ghost btn-circle">
      <div class="indicator">
        <fa-icon [icon]="faBell" size="lg"></fa-icon>
        <span class="badge badge-xs badge-primary indicator-item"></span>
      </div>
    </button>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
        <div class="w-10 rounded-full bg-primary text-primary-content flex items-center justify-center">
          <span class="font-medium">{{ userName() | slice:0:1 }}</span>
        </div>
      </div>
      <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
        <li>
          <a class="justify-between">
            <div>
              <p class="font-medium">{{ userName() }}</p>
              <p class="text-xs text-base-content/50">{{ userRole() }}</p>
            </div>
          </a>
        </li>
        <li><a><fa-icon [icon]="faUser" class="w-4"></fa-icon> Profile</a></li>
        <li><a><fa-icon [icon]="faBell" class="w-4"></fa-icon> Notifications</a></li>
        <div class="divider my-1"></div>
        <li>
          <a class="text-error" (click)="onLogout()">
            <fa-icon [icon]="faSignOutAlt" class="w-4"></fa-icon>
            Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
