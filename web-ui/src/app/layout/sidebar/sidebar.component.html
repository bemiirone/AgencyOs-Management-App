<div class="bg-base-100 min-h-full w-64 p-4 border-r border-base-200">
  <div class="mb-6 px-2">
    <h2 class="text-2xl font-bold text-primary">AgencyOS</h2>
    @if (tenantName()) {
      <div class="flex items-center gap-2 mt-2">
        <fa-icon [icon]="faBuilding" class="text-xs text-base-content/50"></fa-icon>
        <span class="text-sm text-base-content/60">{{ tenantName() }}</span>
      </div>
    }
  </div>

  <ul class="menu w-full">
    @for (item of navItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        >
          <fa-icon [icon]="item.icon" class="w-5"></fa-icon>
          {{ item.label }}
        </a>
      </li>
    }
    @if (userRole() === 'admin') {
      <li class="menu-title mt-4"><span>Admin</span></li>
      @for (item of adminNavItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
          >
            <fa-icon [icon]="item.icon" class="w-5"></fa-icon>
            {{ item.label }}
          </a>
        </li>
      }
    }
  </ul>

  <div class="mt-auto pt-6 px-2">
    <div class="card bg-base-200">
      <div class="card-body p-4">
        <p class="text-sm font-medium">Need help?</p>
        <p class="text-xs text-base-content/60">Check our documentation</p>
        <a href="#" class="btn btn-sm btn-primary mt-2">Docs</a>
      </div>
    </div>
  </div>
</div>
