<dialog #dialogEl class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <h3 class="font-bold text-lg">{{ title() }}</h3>
    <p class="py-4">{{ message() }}</p>
    <div class="modal-action">
      <button class="btn" (click)="onCancel()">{{ cancelText() }}</button>
      <button class="btn btn-{{ variant() }}" (click)="onConfirm()">{{ confirmText() }}</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
