<div class="container p-6 max-w-4xl">
  <h1 class="text-3xl font-bold mb-8">Documentation & FAQ</h1>

  @if (loading()) {
    <div class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else {
    <app-search-card
      [searchQuery]="searchQuery()"
      [resultCount]="resultCount()"
      placeholder="Search FAQs by topic, question, or answer..."
      (searchChange)="onSearchChange($event)"
      (clear)="onClearSearch()"
    />

    <app-faq-accordion
      [faqs]="filteredFaqs()"
      [searchQuery]="searchQuery()"
      [expandedHeadings]="expandedHeadings()"
      [expandedQuestions]="expandedQuestions()"
      (headingToggle)="onHeadingToggle($event)"
      (questionToggle)="onQuestionToggle($event)"
    />
  }
</div>
