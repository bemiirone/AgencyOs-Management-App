<div class="container p-6 max-w-3xl">
  <h1 class="text-3xl font-bold mb-6">Profile Settings</h1>

  <app-profile-info
    [name]="name()"
    [email]="email()"
    [saving]="saving()"
    (save)="onSaveProfile($event)"
  />

  <app-workspace-list
    [workspaces]="workspaces()"
    (joined)="onWorkspaceJoined()"
  />

  <app-change-password
    [changingPassword]="changingPassword()"
    [resetTrigger]="passwordResetCount()"
    (changePassword)="onChangePassword()"
  />
</div>
