<div class="p-6">
  <div class="mb-6">
    <a routerLink="/projects" queryParamsHandling="preserve" class="btn btn-ghost btn-sm gap-2">
      <fa-icon [icon]="faArrowLeft"></fa-icon>
      Back to Projects
    </a>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <fa-icon [icon]="faSpinner" class="animate-spin text-4xl text-primary"></fa-icon>
    </div>
  } @else if (dataLoaded()) {
    <div class="card bg-base-100 shadow max-w-2xl">
      <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Edit Project</h2>

        @if (error()) {
          <div class="alert alert-error mb-4">
            <span>{{ error() }}</span>
          </div>
        }

        <form (ngSubmit)="onSubmit()" #projectForm="ngForm">
          <div class="form-control mb-4">
            <label for="edit-name" class="label">
              <span class="label-text font-medium">Name</span>
            </label>
            <input
              id="edit-name"
              type="text"
              [(ngModel)]="form.name"
              name="name"
              placeholder="Enter project name"
              class="input input-bordered w-full"
              required
              #nameModel="ngModel"
            />
            @if (nameModel.invalid && nameModel.touched) {
              <div class="label">
                <span class="label-text-alt text-error">Name is required</span>
              </div>
            }
          </div>

          <div class="form-control mb-4">
            <label for="edit-desc" class="label">
              <span class="label-text font-medium">Description</span>
            </label>
            <textarea
              id="edit-desc"
              [(ngModel)]="form.description"
              name="description"
              placeholder="Enter project description"
              class="textarea textarea-bordered w-full"
              rows="4"
            ></textarea>
          </div>

          <div class="form-control mb-4">
            <label for="edit-status" class="label">
              <span class="label-text font-medium">Status</span>
            </label>
            <select id="edit-status" [(ngModel)]="form.status" name="status" class="select select-bordered w-full">
              <option value="draft">Draft</option>
              <option value="active">Active</option>
              <option value="on_hold">On Hold</option>
              <option value="completed">Completed</option>
              <option value="archived">Archived</option>
            </select>
          </div>

          <div class="form-control mb-4">
            <label for="edit-client" class="label">
              <span class="label-text font-medium">Client ID</span>
            </label>
            <input
              id="edit-client"
              type="text"
              [(ngModel)]="form.clientId"
              name="clientId"
              placeholder="Enter client ID (optional)"
              class="input input-bordered w-full"
            />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div class="form-control">
              <label for="edit-start" class="label">
                <span class="label-text font-medium">Start Date</span>
              </label>
              <input
                id="edit-start"
                type="date"
                [(ngModel)]="form.startDate"
                name="startDate"
                class="input input-bordered w-full"
              />
            </div>

            <div class="form-control">
              <label for="edit-end" class="label">
                <span class="label-text font-medium">End Date</span>
              </label>
              <input
                id="edit-end"
                type="date"
                [(ngModel)]="form.endDate"
                name="endDate"
                class="input input-bordered w-full"
              />
            </div>
          </div>

          <div class="form-control mb-6">
            <label for="edit-budget" class="label">
              <span class="label-text font-medium">Budget</span>
            </label>
            <input
              id="edit-budget"
              type="number"
              [(ngModel)]="form.budget"
              name="budget"
              placeholder="0"
              class="input input-bordered w-full"
              min="0"
            />
          </div>

          <div class="flex gap-3">
            <button
              type="submit"
              class="btn btn-primary flex-1"
              [disabled]="projectForm.invalid || saving()"
            >
              @if (saving()) {
                <fa-icon [icon]="faSpinner" class="animate-spin mr-2"></fa-icon>
                Saving...
              } @else {
                <fa-icon [icon]="faSave" class="mr-2"></fa-icon>
                Save Changes
              }
            </button>
            <a [routerLink]="['/projects', projectId()]" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  }
</div>
