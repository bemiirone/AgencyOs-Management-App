<div class="p-6">
  <div class="mb-8">
    <div class="flex items-center gap-3">
      <h1 class="text-3xl font-bold text-base-content">Welcome back, {{ userName() }}!</h1>
      @if (tenantName()) {
        <span class="badge badge-primary badge-outline">{{ tenantName() }}</span>
      }
    </div>
    <p class="text-base-content/60 mt-1">Here's what's happening with your projects today.</p>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <fa-icon [icon]="faClock" class="animate-spin text-4xl text-primary"></fa-icon>
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      @for (item of statItems; track item.key) {
        <app-stat-card
          [icon]="item.icon"
          [value]="stats()[item.key]"
          [title]="item.title"
          [description]="item.description"
          [colorClass]="item.color"
        />
      }
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <app-recent-activity [activities]="activities()" />
      <app-team-members [members]="teamMembers()" />
    </div>
  }
</div>
