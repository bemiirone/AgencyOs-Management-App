<div class="card bg-base-200 mb-4">
  <div class="card-body p-4">
    <div class="flex justify-between items-center mb-2">
      <h3 class="card-title text-lg">
        {{ content.content('invoice.form.section.lineItems') }}
      </h3>
      <button
        type="button"
        class="btn btn-sm btn-primary"
        (click)="add.emit()"
      >
        <fa-icon [icon]="faPlus" class="mr-2"></fa-icon>
        {{ content.content('invoice.form.button.addLineItem') }}
      </button>
    </div>

    <div formArrayName="lineItems">
      @for (item of lineItems().controls; track $index) {
        <div
          [formGroupName]="$index"
          class="grid grid-cols-12 gap-2 mb-2 items-end"
        >
          <div class="col-span-4 form-control">
            <input
              type="text"
              formControlName="description"
              class="input input-bordered input-sm w-full"
              [placeholder]="content.content('invoice.detail.table.description')"
            />
          </div>
          <div class="col-span-2 form-control">
            <input
              type="number"
              formControlName="quantity"
              class="input input-bordered input-sm w-full"
              placeholder="Qty"
              min="0"
              step="1"
              (input)="change.emit()"
            />
          </div>
          <div class="col-span-2 form-control">
            <input
              type="number"
              formControlName="rate"
              class="input input-bordered input-sm w-full"
              placeholder="Rate"
              min="0"
              step="0.01"
              (input)="change.emit()"
            />
          </div>
          <div class="col-span-3 form-control">
            <input
              type="number"
              formControlName="amount"
              class="input input-bordered input-sm w-full"
              [placeholder]="content.content('invoice.detail.table.amount')"
              min="0"
              step="0.01"
              readonly
            />
          </div>
          <div class="col-span-1">
            <button
              type="button"
              class="btn btn-sm btn-error btn-ghost"
              (click)="remove.emit($index)"
            >
              <fa-icon [icon]="faTrash"></fa-icon>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
