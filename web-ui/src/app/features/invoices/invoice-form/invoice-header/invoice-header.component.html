<div class="p-6">
  <div class="mb-6">
    <a
      routerLink="/invoices"
      queryParamsHandling="preserve"
      class="btn btn-ghost btn-sm gap-2"
    >
      <fa-icon [icon]="faArrowLeft"></fa-icon>
      {{ content.content('invoice.form.back') }}
    </a>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <fa-icon
        [icon]="faSpinner"
        class="animate-spin text-4xl text-primary"
      ></fa-icon>
    </div>
  } @else {
    <div class="card bg-base-100 shadow max-w-4xl">
      <div class="card-body">
        <h2 class="card-title text-2xl mb-4">
          {{
            mode() === 'create'
              ? content.content('invoice.form.title.create')
              : content.content('invoice.form.title.edit')
          }}
        </h2>

        @if (error()) {
          <div class="alert alert-error mb-4">
            <span>{{ error() }}</span>
          </div>
        }

        <ng-content></ng-content>
      </div>
    </div>
  }
</div>
