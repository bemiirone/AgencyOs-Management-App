<div [formGroup]="form()">
<div class="form-control mb-4">
  <label class="label cursor-pointer">
    <span class="label-text font-medium">{{
      content.content('invoice.form.label.addExpenses')
    }}</span>
    <input
      type="checkbox"
      class="toggle toggle-primary"
      [checked]="$any(expenses()).length > 0"
      (change)="$any(expenses()).length === 0 ? add.emit() : clear.emit()"
    />
  </label>
</div>

@if ($any(expenses()).length > 0) {
  <div class="card bg-base-200 mb-4">
    <div class="card-body p-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="card-title text-lg">
          {{ content.content('invoice.form.section.expenses') }}
        </h3>
        <button
          type="button"
          class="btn btn-sm btn-primary"
          (click)="add.emit()"
        >
          <fa-icon [icon]="faPlus" class="mr-2"></fa-icon>
          {{ content.content('invoice.form.button.addExpense') }}
        </button>
      </div>

      <div formArrayName="expenses">
        @for (expense of expenses().controls; track $index) {
          <div
            [formGroupName]="$index"
            class="grid grid-cols-12 gap-2 mb-2 items-end"
          >
            <div class="col-span-5 form-control">
              <input
                type="text"
                formControlName="description"
                class="input input-bordered input-sm w-full"
                [placeholder]="content.content('invoice.detail.table.description')"
              />
            </div>
            <div class="col-span-3 form-control">
              <input
                type="number"
                formControlName="amount"
                class="input input-bordered input-sm w-full"
                [placeholder]="content.content('invoice.detail.table.amount')"
                min="0"
                step="0.01"
                (input)="updateTotals.emit()"
              />
            </div>
            <div class="col-span-3 form-control">
              <input
                type="date"
                formControlName="date"
                class="input input-bordered input-sm w-full"
              />
            </div>
            <div class="col-span-1">
              <button
                type="button"
                class="btn btn-sm btn-error btn-ghost"
                (click)="remove.emit($index)"
              >
                <fa-icon [icon]="faTrash"></fa-icon>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
</div>
