<div [formGroup]="form()">
<div class="card bg-base-200 mb-4">
  <div class="card-body p-4">
    <h3 class="card-title text-lg mb-2">
      <fa-icon [icon]="faClock" class="mr-2"></fa-icon>
      {{ content.content('invoice.form.section.fetchTime') }}
    </h3>

    <app-invoice-time-entry-table
      [form]="form()"
      [entries]="entries()"
      [selectedIds]="selectedIds()"
      [loading]="loading()"
      [billingType]="billingType()"
      [calculationResult]="calculationResult()"
      [calculationDetails]="calculationDetails()"
      [allSelected]="allSelected()"
      (toggle)="toggleEntry.emit($event)"
      (toggleAll)="toggleSelectAll.emit()"
    />

    <app-invoice-calculation-summary
      [form]="form()"
      [billingType]="billingType()"
      [calculationResult]="calculationResult()"
      [selectedCount]="selectedCount()"
      [availableOvertime]="availableOvertime()"
      [overtimeExceeds]="overtimeExceeds()"
      [aggregating]="aggregating()"
      (calculate)="calculate.emit()"
    />
  </div>
</div>
</div>
