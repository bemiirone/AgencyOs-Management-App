<div class="p-6">
  <div class="mb-6">
    <a routerLink="/tasks" queryParamsHandling="preserve" class="btn btn-ghost btn-sm gap-2">
      <fa-icon [icon]="faArrowLeft"></fa-icon>
      Back to Tasks
    </a>
  </div>

  <div class="card bg-base-100 shadow max-w-2xl">
    <div class="card-body">
      <h2 class="card-title text-2xl mb-4">Create New Task</h2>

      @if (error()) {
        <div class="alert alert-error mb-4">
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
        <div class="form-control mb-4">
          <label for="task-title" class="label">
            <span class="label-text font-medium">Title</span>
          </label>
          <input
            id="task-title"
            type="text"
            formControlName="title"
            placeholder="Enter task title"
            class="input input-bordered w-full"
            [class.input-error]="titleControl?.invalid && titleControl?.touched"
          />
          @if (titleControl?.invalid && titleControl?.touched) {
            <div class="label">
              <span class="label-text-alt text-error">Title is required</span>
            </div>
          }
        </div>

        <div class="form-control mb-4">
          <label for="task-desc" class="label">
            <span class="label-text font-medium">Description</span>
          </label>
          <textarea
            id="task-desc"
            formControlName="description"
            placeholder="Enter task description"
            class="textarea textarea-bordered w-full"
            rows="4"
          ></textarea>
        </div>

        <div class="form-control mb-4">
          <label for="task-project" class="label">
            <span class="label-text font-medium">Project</span>
          </label>
          <select
            id="task-project"
            formControlName="projectId"
            class="select select-bordered w-full"
            [class.select-error]="projectIdControl?.invalid && projectIdControl?.touched"
          >
            <option value="" disabled>Select a project</option>
            @for (project of availableProjects(); track project._id) {
              <option [value]="project._id">{{ project.name }}</option>
            }
          </select>
          <div class="label">
            <span class="label-text-alt text-base-content/50">
              <fa-icon [icon]="faInfoCircle" class="mr-1"></fa-icon>
              Only Active and Draft projects are available for task assignment
            </span>
          </div>
          @if (projectIdControl?.invalid && projectIdControl?.touched) {
            <div class="label">
              <span class="label-text-alt text-error">Project is required</span>
            </div>
          }
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div class="form-control">
            <label for="task-status" class="label">
              <span class="label-text font-medium">Status</span>
            </label>
            <select id="task-status" formControlName="status" class="select select-bordered w-full">
              <option value="todo">To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="in_review">In Review</option>
              <option value="done">Done</option>
            </select>
          </div>

          <div class="form-control">
            <label for="task-priority" class="label">
              <span class="label-text font-medium">Priority</span>
            </label>
            <select id="task-priority" formControlName="priority" class="select select-bordered w-full">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
        </div>

        <div class="form-control mb-6">
          <label for="task-due" class="label">
            <span class="label-text font-medium">Due Date</span>
          </label>
          <input
            id="task-due"
            type="date"
            formControlName="dueDate"
            class="input input-bordered w-full"
          />
        </div>

        <div class="form-control mb-6">
          <label for="task-assignee" class="label">
            <span class="label-text font-medium">Assignee</span>
          </label>
          <select id="task-assignee" formControlName="assigneeId" class="select select-bordered w-full">
            <option value="">Unassigned</option>
            @for (user of userStore.users(); track user.id) {
              <option [value]="user.id">{{ user.name }}</option>
            }
          </select>
        </div>

        <div class="flex gap-3">
          <button
            type="submit"
            class="btn btn-primary flex-1"
            [disabled]="taskForm.invalid || loading()"
          >
            @if (loading()) {
              <fa-icon [icon]="faSpinner" class="animate-spin mr-2"></fa-icon>
              Creating...
            } @else {
              <fa-icon [icon]="faSave" class="mr-2"></fa-icon>
              Create Task
            }
          </button>
          <a routerLink="/tasks" queryParamsHandling="preserve" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
