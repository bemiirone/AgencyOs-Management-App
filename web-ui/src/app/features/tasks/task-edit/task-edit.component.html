<div class="p-6">
  <div class="mb-6">
    <a routerLink="/tasks" class="btn btn-ghost btn-sm gap-2">
      <fa-icon [icon]="faArrowLeft"></fa-icon>
      Back to Tasks
    </a>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <fa-icon [icon]="faSpinner" class="animate-spin text-4xl text-primary"></fa-icon>
    </div>
  } @else if (dataLoaded()) {
    <div class="card bg-base-100 shadow max-w-2xl">
      <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Edit Task</h2>

        @if (error()) {
          <div class="alert alert-error mb-4">
            <span>{{ error() }}</span>
          </div>
        }

        <form (ngSubmit)="onSubmit()" #taskForm="ngForm">
          <div class="form-control mb-4">
            <label for="edit-task-title" class="label">
              <span class="label-text font-medium">Title</span>
            </label>
            <input
              id="edit-task-title"
              type="text"
              [(ngModel)]="form.title"
              name="title"
              placeholder="Enter task title"
              class="input input-bordered w-full"
              required
              #titleModel="ngModel"
            />
            @if (titleModel.invalid && titleModel.touched) {
              <div class="label">
                <span class="label-text-alt text-error">Title is required</span>
              </div>
            }
          </div>

          <div class="form-control mb-4">
            <label for="edit-task-desc" class="label">
              <span class="label-text font-medium">Description</span>
            </label>
            <textarea
              id="edit-task-desc"
              [(ngModel)]="form.description"
              name="description"
              placeholder="Enter task description"
              class="textarea textarea-bordered w-full"
              rows="4"
            ></textarea>
          </div>

          <div class="form-control mb-4">
            <label for="edit-task-project" class="label">
              <span class="label-text font-medium">Project</span>
            </label>
            <select
              id="edit-task-project"
              [(ngModel)]="form.projectId"
              name="projectId"
              class="select select-bordered w-full"
              required
              #projectModel="ngModel"
            >
              <option value="" disabled>Select a project</option>
              @for (project of projects(); track project._id) {
                <option [value]="project._id">{{ project.name }}</option>
              }
            </select>
            @if (projectModel.invalid && projectModel.touched) {
              <div class="label">
                <span class="label-text-alt text-error">Project is required</span>
              </div>
            }
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div class="form-control">
              <label for="edit-task-status" class="label">
                <span class="label-text font-medium">Status</span>
              </label>
              <select id="edit-task-status" [(ngModel)]="form.status" name="status" class="select select-bordered w-full">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="in_review">In Review</option>
                <option value="done">Done</option>
              </select>
            </div>

            <div class="form-control">
              <label for="edit-task-priority" class="label">
                <span class="label-text font-medium">Priority</span>
              </label>
              <select id="edit-task-priority" [(ngModel)]="form.priority" name="priority" class="select select-bordered w-full">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="form-control mb-6">
            <label for="edit-task-due" class="label">
              <span class="label-text font-medium">Due Date</span>
            </label>
            <input
              id="edit-task-due"
              type="date"
              [(ngModel)]="form.dueDate"
              name="dueDate"
              class="input input-bordered w-full"
            />
          </div>

          <div class="form-control mb-6">
            <label for="edit-task-assignee" class="label">
              <span class="label-text font-medium">Assignee</span>
            </label>
            <select id="edit-task-assignee" [(ngModel)]="form.assigneeId" name="assigneeId" class="select select-bordered w-full">
              <option value="">Unassigned</option>
              @for (user of userStore.users(); track user.id) {
                <option [value]="user.id">{{ user.name }}</option>
              }
            </select>
          </div>

          <div class="form-control mb-6">
            <label for="edit-task-creator" class="label">
              <span class="label-text font-medium">Created By</span>
            </label>
            <input id="edit-task-creator" type="text" [value]="getCreatorName()" class="input input-bordered w-full" disabled />
          </div>

          <div class="flex gap-3">
            <button
              type="submit"
              class="btn btn-primary flex-1"
              [disabled]="taskForm.invalid || saving()"
            >
              @if (saving()) {
                <fa-icon [icon]="faSpinner" class="animate-spin mr-2"></fa-icon>
                Saving...
              } @else {
                <fa-icon [icon]="faSave" class="mr-2"></fa-icon>
                Save Changes
              }
            </button>
            <a [routerLink]="['/tasks', taskId()]" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  }
</div>
