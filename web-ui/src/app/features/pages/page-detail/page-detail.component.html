<div class="drawer lg:drawer-open">
  <input id="page-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col min-h-screen">
    <app-header></app-header>

    <main class="flex-1 bg-base-200 pb-12 py-6">
      <div class="max-w-4xl px-4 sm:px-6 lg:px-8">
        @if (loading()) {
          <div class="flex items-center justify-center py-20">
            <span class="loading loading-spinner loading-lg text-primary"></span>
          </div>
        } @else if (error()) {
          <div class="alert alert-error">
            <fa-icon [icon]="faArrowLeft" class="mr-2"></fa-icon>
            <span>{{ error() }}</span>
            <a routerLink="/dashboard" class="btn btn-sm btn-ghost">Back to Dashboard</a>
          </div>
        } @else if (page()) {
            <h1 class="text-3xl font-bold text-base-content mb-6">
              {{ page()?.title }}
            </h1>
            <div class="prose prose-base max-w-none" [innerHTML]="page()?.content"></div>
        }
      </div>
    </main>

    <app-footer></app-footer>
  </div>

  <div class="drawer-side">
    <label for="page-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <app-sidebar></app-sidebar>
  </div>
</div>
